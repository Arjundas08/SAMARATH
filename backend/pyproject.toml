[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "samarath-backend"
version = "0.1.0"
description = "System for Automated Maintenance Allocation, Rolling Availability, and Track Harmony"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Team NIRVIKALP", email = "nirvikalp@sih2026.internal" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "ortools>=9.10.4067",
    "sqlalchemy>=2.0.31",
    "alembic>=1.13.2",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
]
test = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.8",
    "coverage>=7.5.0",
]
