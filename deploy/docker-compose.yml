version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: samarath_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-samarath}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samarath"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - samarath-network

  # FastAPI Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: samarath_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_NAME: SAMARATH
      APP_PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/samarath
      SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/samarath
      SECRET_KEY: ${SECRET_KEY:-samarath_sih26027_change_in_production}
      DEFAULT_CORRIDOR: VKC
      TZ: Asia/Kolkata
    depends_on:
      db:
        condition: service_healthy
    networks:
      - samarath-network

  # React Frontend (Nginx)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: samarath_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    networks:
      - samarath-network

volumes:
  postgres_data:

networks:
  samarath-network:
    driver: bridge
